# PostgreSQL for agent machine metadata (global state).
# Start: docker compose up -d
# Stop:  docker compose down

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: machines_db
    ports:
      # Use 5433 on host if another Postgres already uses 5432 (e.g. Homebrew).
      - 5433:5432
    volumes:
      - agentic-postgres-data:/var/lib/postgresql/data

volumes:
  agentic-postgres-data: